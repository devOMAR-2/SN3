; SN3 production PHP overrides (loaded after php.ini-production).

expose_php = Off
memory_limit = 256M

; Code is immutable inside the image, so timestamps never need revalidation.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Attachments (CORE-008, ADR-027 §5): 25 MiB per file on Cloud (SN3_ATTACHMENTS_MAX_BYTES). PHP's
; limits sit just above it so the application answers 413 itself; raise both with the setting.
upload_max_filesize = 26M
post_max_size = 27M
