ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # Laravel's public/.htaccess provides the front-controller rewrite rules.
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2

    # Access log without query strings or Referer (AGENTS.md §6, API_SPEC §13): signed-link
    # signatures and email addresses can travel in query strings, and a page's full URL in the
    # Referer header. %U is the path only. Password-reset tokens never reach the server at all:
    # they travel in the URL fragment (ResetPasswordNotification).
    #
    # Invitation tokens are part of the API path (/api/v1/invitations/<token>/…, API_SPEC.md §3.1),
    # so those requests are logged with the token replaced and the action kept (ADR-025 §2). The
    # conditions read THE_REQUEST, the original request line: Laravel's rewrite to index.php is an
    # internal redirect, after which per-request variables and paths no longer match.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" sn3
    LogFormat "%h %l %u %t \"%m /api/v1/invitations/[REDACTED]/preview %H\" %>s %O \"%{User-Agent}i\"" sn3_invitation_preview
    LogFormat "%h %l %u %t \"%m /api/v1/invitations/[REDACTED]/accept %H\" %>s %O \"%{User-Agent}i\"" sn3_invitation_accept
    LogFormat "%h %l %u %t \"%m /api/v1/invitations/[REDACTED] %H\" %>s %O \"%{User-Agent}i\"" sn3_invitation_other
    CustomLog /proc/self/fd/1 sn3 "expr=! %{THE_REQUEST} =~ m#^\S+ \S*/api/v1/invitations/#i"
    CustomLog /proc/self/fd/1 sn3_invitation_preview "expr=%{THE_REQUEST} =~ m#^\S+ \S*/api/v1/invitations/[^/?\s]*/preview[?\s]#i"
    CustomLog /proc/self/fd/1 sn3_invitation_accept "expr=%{THE_REQUEST} =~ m#^\S+ \S*/api/v1/invitations/[^/?\s]*/accept[?\s]#i"
    CustomLog /proc/self/fd/1 sn3_invitation_other "expr=%{THE_REQUEST} =~ m#^\S+ \S*/api/v1/invitations/#i && ! %{THE_REQUEST} =~ m#^\S+ \S*/api/v1/invitations/[^/?\s]*/(preview|accept)[?\s]#i"
</VirtualHost>
