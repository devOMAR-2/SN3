ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # Laravel's public/.htaccess provides the front-controller rewrite rules.
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/public/build/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2

    # Access log without query strings or Referer (AGENTS.md §6, API_SPEC §13): signed-link
    # signatures and email addresses can travel in query strings, and a page's full URL in the
    # Referer header. %U is the path only. Password-reset tokens never reach the server at all:
    # they travel in the URL fragment (ResetPasswordNotification).
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %O \"%{User-Agent}i\"" sn3
    CustomLog /proc/self/fd/1 sn3
</VirtualHost>
