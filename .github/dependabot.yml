version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Major lines are fixed by DECIDED-010; changing them requires a new ADR (docs/adr/ADR-011).
      - dependency-name: "laravel/framework"
        update-types: ["version-update:semver-major"]
      - dependency-name: "inertiajs/inertia-laravel"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Major lines are fixed by DECIDED-010; changing them requires a new ADR (docs/adr/ADR-011).
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@inertiajs/vue3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
