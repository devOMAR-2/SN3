name: "✨ Feature request"
description: "Suggest a new feature or improvement for SN3."
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SN3. Search existing issues before submitting. Do not include credentials or sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user problem are we solving, and for whom?
      placeholder: "As a project member, I need... because..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected behavior and user experience.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable outcomes.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or other approaches.
  - type: textarea
    id: references
    attributes:
      label: Related issues and references
      description: Link related issues, designs, or documentation; do not disclose private information.
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched for existing issues and feature requests.
          required: true
        - label: I did not include secrets or sensitive information.
          required: true
