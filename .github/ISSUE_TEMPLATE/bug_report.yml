name: "🐛 Bug report"
description: "Report a reproducible issue in SN3."
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must NOT be reported publicly.** Use the repository's Security tab → Report a vulnerability (if enabled), or the private contact method listed in SECURITY.md.
        Never post tokens, passwords, personal data, or private project content.
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Describe what is broken.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Cloud
        - Self-hosted
        - Local development
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SN3 version / commit
      placeholder: "v1.0.0 or commit SHA (if known)"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, relevant configuration (redact secrets).
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots
      description: Redact tokens, emails, private data, and other sensitive information.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context / related issues
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched for an existing report of this bug.
          required: true
        - label: This report does not disclose a security vulnerability or sensitive information.
          required: true
